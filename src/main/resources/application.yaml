spring:
  application:
    name: LearnWebFlux
  threads:
    virtual:
      enabled: true

#   C:\Apache24\Apache24\bin\ab.exe -n 5000 -c 500 -s 300 http://localhost:8080/api/v1/benchmark/users/1
#   1. C:\Apache24\Apache24\bin\ab.exe :- This is the path to ApacheBench. ab.exe = Apache Benchmark tool
#   2. -n 5000 = number of total requests
#   3. -c 500 = concurrency
#   4. -s 300 = timeout in seconds. means ApacheBench can wait up to 300 seconds for socket operations.